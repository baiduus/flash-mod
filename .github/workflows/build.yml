name: Compilar jar
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Nomes SRG
        run: grep -h "ServerGamePacketListenerImpl" $(find build ~/.gradle -name "*.srg" -o -name "*.tsrg" 2>/dev/null | head -5) | grep -i "isSingleplayerOwner\|handleMovePlayer\|m_9956_" | head -20 || true
      - name: Conferir jarjar
        run: for j in build/libs/*.jar; do echo "== $j"; unzip -l "$j" | grep -i "jarjar\|bendy" || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: flash-jar
          path: build/libs/*.jar
