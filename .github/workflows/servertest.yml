name: Testar servidor
on:
  push:
    branches: [ci-servertest]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Run server
        run: |
          chmod +x gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-type=minecraft\\\\:flat\nonline-mode=false\nspawn-protection=0\n" > run/server.properties
          timeout 600 ./gradlew runServer --no-daemon > server.log 2>&1 || true
          echo "== tail"; tail -n 60 server.log
          echo "== problems"; grep -n "Exception\|ERROR\|Caused by\|flash" run/logs/latest.log | head -150 || true
          echo "== done"; grep -n "Done (" run/logs/latest.log || true
